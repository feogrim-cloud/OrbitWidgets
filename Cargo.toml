[package]
name = "orbit-widgets"
version = "1.1.5"
edition = "2021"
description = "Transparent circular performance widgets for Windows"
license = "MIT"

[features]
startup-qa = []
gallery = ["eframe/__screenshot"]

[[example]]
name = "gallery"
path = "examples/gallery.rs"
required-features = ["gallery"]

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.35.2", default-features = false, features = ["system"] }
libloading = "0.8.9"
xml-rs = "=0.8.29"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
